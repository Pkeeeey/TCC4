<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libris - Home</title>
<link rel="stylesheet" href="style.css">
<script src="books.js"></script>
</head>
<body>
<header>
  <div class="logo">Libris</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="library.html">Library</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="publish.html">Publish</a></li>
    </ul>
  </nav>
  <button id="toggleDark">🌙</button>
</header>

<section class="hero">
  <h1>Libris Digital</h1>
  <p>Leitura limpa. Design minimalista. Foco total.</p>
</section>

<section class="container" style="padding-top:40px;">
  <h2 class="section-title">Literatura Portuguesa em Destaque</h2>
  <div id="featuredGrid" class="catalogo-grid"></div>
  <div style="text-align:center;margin-top:22px;">
    <a href="library.html" style="font-weight:700;color:#1a8917;text-decoration:none;font-size:1.05rem;">Mais +</a>
  </div>
</section>

<footer>© 2025 Libris Digital</footer>

<script>
// Dark mode with persistence
const toggle = document.getElementById('toggleDark');
const theme = localStorage.getItem('libris-theme');
if(theme==='dark') document.body.classList.add('dark');
toggle.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('libris-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});

// render featured first 10 books (ensure books loaded)
function renderFeatured(){
  const container = document.getElementById('featuredGrid');
  container.innerHTML = '';
  const featured = books.slice(0,10);
  featured.forEach(b=>{
    const id = b.id;
    container.innerHTML += `
      <div class="card">
        <img src="https://picsum.photos/400/640?random=${id+20}">
        <h3>${b.title}</h3>
        <p>${b.author}</p>
        <a href="read.html?id=${id}">Ler →</a>
      </div>
    `;
  });
  // reveal animation
  requestAnimationFrame(()=> {
    document.querySelectorAll('.card').forEach((c,i)=>setTimeout(()=>c.classList.add('visible'), i*40));
  });
}
document.addEventListener('DOMContentLoaded',renderFeatured);
</script>

</body>
</html>
