<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libris - Library</title>
<link rel="stylesheet" href="style.css">
<script src="books.js"></script>
</head>
<body>
<header>
  <div class="logo">Libris</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="library.html">Library</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="publish.html">Publish</a></li>
    </ul>
  </nav>
  <button id="toggleDark">🌙</button>
</header>

<section class="container" style="padding-top:120px;">
  <h2 class="section-title">Library</h2>

  <div class="search-row">
    <input id="searchBar" type="text" placeholder="Buscar livro por título..." />
    <select id="filterAuthor"><option value="all">Todos os autores</option></select>
  </div>

  <div id="bookGrid" class="catalogo-grid"></div>
</section>

<footer>© 2025 Libris Digital</footer>

<script>
// Dark mode with persistence
const toggle = document.getElementById('toggleDark');
const theme = localStorage.getItem('libris-theme');
if(theme==='dark') document.body.classList.add('dark');
toggle.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('libris-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});

// populate authors and render
const grid = document.getElementById('bookGrid');
const search = document.getElementById('searchBar');
const filter = document.getElementById('filterAuthor');

function populateAuthors(){
  const authors = [...new Set(books.map(b=>b.author))].sort();
  authors.forEach(a=>{
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    filter.appendChild(opt);
  });
}

function renderBooks(){
  const term = search.value.toLowerCase();
  const auth = filter.value;
  grid.innerHTML = '';
  const filtered = books
    .filter(b=>b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term))
    .filter(b=> auth==='all' ? true : b.author===auth);

  filtered.forEach((b,i)=>{
    grid.innerHTML += `
      <div class="card">
        <img src="https://picsum.photos/400/640?random=${b.id+20}">
        <h3>${b.title}</h3>
        <p>${b.author}</p>
        <a href="read.html?id=${b.id}">Ler →</a>
      </div>
    `;
  });
  // add reveal with stagger
  requestAnimationFrame(()=> {
    document.querySelectorAll('.card').forEach((c,i)=>setTimeout(()=>c.classList.add('visible'), i*25));
  });
}

search.addEventListener('input',renderBooks);
filter.addEventListener('change',renderBooks);

document.addEventListener('DOMContentLoaded',()=>{
  populateAuthors();
  renderBooks();
});
</script>

</body>
</html>
